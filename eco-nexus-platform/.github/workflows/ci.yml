name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carbon_dev
          POSTGRES_PASSWORD: carbon_dev_pw   # CI-only throwaway credentials
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carbon_dev" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARBON_TEST_ADMIN_URL: postgresql://carbon_dev:carbon_dev_pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config
          libpqxx-dev libasio-dev nlohmann-json3-dev libgtest-dev libssl-dev postgresql-client
      - run: ./scripts/test.sh
